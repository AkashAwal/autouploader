name: Upload Videos to YouTube

on:
  # Runs every 30 minutes across the active window (UTC). The uploader itself
  # decides what to do based on IST slots (11:00 and 17:00 IST), so most runs
  # are no-ops. Running often makes the schedule self-healing: if GitHub delays
  # or drops a run, the next one fills the missed slot. The slot bookkeeping in
  # uploaded.json guarantees at most 2 uploads per channel per day.
  #   05:30 UTC = 11:00 IST (morning slot)
  #   11:30 UTC = 17:00 IST (evening slot)
  #   window 05:00-17:30 UTC = 10:30-23:00 IST (catch-up room)
  schedule:
    - cron: "*/30 5-17 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never let two runs upload at the same time (avoids state races / double posts).
concurrency:
  group: uploader
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install "pycryptodome>=3.9.6"

      - name: Run uploader
        env:
          GOOGLE_TOKEN_CH1: ${{ secrets.GOOGLE_TOKEN_CH1 }}
          GOOGLE_TOKEN_CH2: ${{ secrets.GOOGLE_TOKEN_CH2 }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: python main.py

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add uploaded.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "chore: update uploaded state [skip ci]"
          # Robust push: rebase onto any concurrent changes and retry so a
          # losing race never discards an upload we already performed.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying in 5s..."
            sleep 5
          done
          echo "::error::Failed to push updated state after 5 attempts."
          exit 1
